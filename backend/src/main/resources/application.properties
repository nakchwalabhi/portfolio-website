spring.application.name=bike-rental
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bikerental}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
app.jwt.secret=${JWT_SECRET:bike-rental-secret-key-that-is-at-least-256-bits-long-for-hs256}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
razorpay.key.id=${RAZORPAY_KEY_ID:your_razorpay_key_id}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:your_razorpay_key_secret}
